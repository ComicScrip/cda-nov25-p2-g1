name: Test frontend login-profile browser E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/frontend/**"
      - ".github/workflows/test-frontend-login-profile.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  test-login-profile:
    name: Test login-profile.spec.ts (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve frontend path
        id: frontend-path
        run: |
          if [ -f backend/frontend/package.json ] && [ -f backend/frontend/playwright.config.ts ]; then
            echo "dir=backend/frontend" >> "$GITHUB_OUTPUT"
            echo "lockfile=backend/frontend/package-lock.json" >> "$GITHUB_OUTPUT"
          elif [ -f frontend/package.json ] && [ -f frontend/playwright.config.ts ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
            echo "lockfile=frontend/package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend app with Playwright config found." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.frontend-path.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ steps.frontend-path.outputs.dir }}
        run: npm ci

      - name: Install Playwright browser
        working-directory: ${{ steps.frontend-path.outputs.dir }}
        run: npx playwright install --with-deps chromium

      - name: Run login/profile browser E2E
        working-directory: ${{ steps.frontend-path.outputs.dir }}
        env:
          CI: true
        run: npm run test:e2e:login-profile -- --project=chromium

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-login-profile-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/frontend/playwright-report
            backend/frontend/test-results
          if-no-files-found: ignore
