name: Test frontend login-profile browser E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend-login-profile.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  test-login-profile:
    name: Test login-profile.spec.ts (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run login/profile browser E2E
        env:
          CI: true
        run: npm run test:e2e:login-profile -- --project=chromium

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-login-profile-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
