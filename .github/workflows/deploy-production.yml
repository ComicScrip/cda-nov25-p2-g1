name: Compile and push client and server to production environment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  client-tests:
    # To verify with Pierre whether we have the correct paths for the frontend tests (That's Ok now)
    uses: ./.github/workflows/test-frontend.yml

  server-tests:
    # To verify with Pierre whether we have the correct paths for the backend tests (That's Ok now)
    uses: ./.github/workflows/test-backend.yml

  build-and-push-server:
    needs: 
      - server-tests
    # To verify with Pierre whether we have the correct paths for the backend build
    uses: ./.github/workflows/build-backend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      # Change this to the correct image name for the backend with the correct tag and the correct repository name from the dockerhub
      image_name: mydietchief/mdc-mars26-back:prod

  build-and-push-client:
    needs:
      - client-tests
    # To verify with Pierre whether we have the correct paths for the frontend build
    uses: ./.github/workflows/build-frontend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      # Change this to the correct image name for the frontend with the correct tag and the correct repository name from the dockerhub
      image_name: mydietchief/mdc-mars26-front:prod

  notify-vps:
    needs:
    - build-and-push-server
    - build-and-push-client
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook on VPS
        run: |
          curl -X POST -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" https://ops.cda-nov25-p2g1.duckdns.org/hooks/redeploy-mdc-prod
