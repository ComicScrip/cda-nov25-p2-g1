services:
  db:
    stop_grace_period: 1s
    image: postgres:18.1-alpine3.23
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 2s
      retries: 10
    ports:
      - 5432:5432
  backend:
    stop_grace_period: 1s
    restart: unless-stopped
    build: backend
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -X POST http://localhost:4000 -H 'content-type: application/json' --data '{\"query\":\"{ __typename }\"}' >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      DB_HOST: db
      GRAPHQL_SERVER_PORT: 4000
    ports:
      - 4000:4000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
  frontend:
    stop_grace_period: 1s
    restart: unless-stopped
    build: frontend
    env_file:
      - frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/login >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
