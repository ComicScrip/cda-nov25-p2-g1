query CoachDashboardData {
  coachDashboardData {
    stats {
      users {
        count
        evolution
      }
      publishedRecipes {
        count
        evolution
      }
      scannedMeals {
        count
        evolution
      }
      averageScore {
        count
        evolution
      }
    }
    recentUsers {
      id
      name
      email
      score
      scannedMeals
      lastMealAt
    }
    coachedUsers {
      id
      name
      email
      score
      scannedMeals
      lastMealAt
    }
    recentRecipes {
      id
      name
      calories
      proteins
      carbs
      lipids
    }
  }
}
